name: CI smoke + PR preview
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node smoke.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          name: preview-${{ github.sha }}
          path: .
