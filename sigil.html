<body class="poppet-room">

  <!-- The poppet cartridge. The old forge app lived directly in the screen;
       the workshop (the poppet lab) lives there now, framed inside the bezel.
       The room chrome — carvings, scars, the dock console — stays anchored. -->
  <div class="room">
    <div class="machine">
      <div class="bezel">
        <div class="carvings" id="carvings"></div>
        <div class="vent-slits" aria-hidden="true"></div>
        <div class="corruption-scars" aria-hidden="true">
          <div class="scar scar-1"></div>
          <div class="scar scar-2"></div>
          <div class="scar scar-3"></div>
          <div class="scar scar-4"></div>
          <div class="scar scar-5"></div>
          <div class="scar scar-6"></div>
        </div>
        <div class="led" aria-hidden="true"></div>
        <div class="liber-plate">LIBER · VACUI</div>
        <div class="power-button" aria-hidden="true"></div>
        <div class="screw" aria-hidden="true"></div>

        <div class="screen">
          <div class="screen-stage">
              <header class="poppet-titlebar">
                <span class="poppet-titlebar-name">poppet</span>
                <span class="poppet-titlebar-sub" aria-hidden="true">the workshop</span>
                <button class="poppet-titlebar-leave" type="button" id="sigil-back" aria-label="leave">leave</button>
              </header>
              <div class="lab-frame-wrap" id="lab-frame-wrap">
                <iframe id="lab-frame" class="lab-frame" src="poppet-lab.html?v=lab52" title="the poppet workshop"></iframe>
              </div>
            </div>
          </div>
        </div>
        <div class="monitor-base" aria-hidden="true">
          <span class="base-heart"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="src/boot-gate.js"></script>
  <script src="src/state.js"></script>
  <script src="src/stage.js?v=big1"></script>
  <script src="src/room-shell.js"></script>
  <script src="src/sound.js"></script>
  <script src="data/rooms.data.js"></script>
  <script src="src/house.js"></script>
  <script src="src/shadow.js"></script>
  <script src="src/apply-theme.js"></script>
  <script src="src/carvings.js"></script>
  <script>
    (function () {
      // leave → the desktop, where the home room now lives
      var backBtn = document.getElementById('sigil-back');
      // the lab is same-origin, so its unsaved-work flag is readable directly:
      // a doll with ink on it and no keepsake yet is half-made
      function labHalfMade() {
        try {
          var f = document.getElementById('lab-frame');
          return !!(f && f.contentWindow && f.contentWindow.__labDirty);
        } catch (e) { return false; }
      }
      function goDesktop() {
        if (labHalfMade() && !window.confirm('the doll is half-made; leave anyway?')) return;
        location.href = 'desktop.html';
      }
      if (backBtn) backBtn.addEventListener('click', goDesktop);
      // a kept poppet flies home: the desktop hosts the home room and its rug
      // catches the drop, so the keeping hands off through the parent frame.
      window.addEventListener('message', function (ev) {
        if (ev.data && ev.data.type === 'poppet-kept') location.href = 'desktop.html';
      });
    })();
  </script>
  <script src="src/cartridge-transit.js?v=off1"></script>
  <script src="src/crt-bay.js?v=mem7"></script>
  <script src="vendor/pixi.min.js"></script>
  <script src="src/pixi-runtime.js"></script>
  <script src="src/pixi-palette.js?v=cleanup-20260922"></script>
  <script src="src/trave-rom.js?v=run13"></script>
</body>
</html>
