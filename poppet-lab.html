<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="data:,">
<title>Poppet Lab — the desk is the interface</title>
<link rel="stylesheet" href="./poppet-lab/lab.css?v=lab51">
<script src="src/boot-gate.js"></script>
</head>
<body>
<div class="tube">
  <div class="board stage-only">
    <div class="stage">
      <canvas id="view"></canvas>
      <div class="ledger" id="tool-ledger"></div>
      <div class="lesson-card" id="lesson-card"></div>
      <div class="stamp">SPECIMEN · LIVE</div>
      <div class="hint" id="mode-hint">layer I — paint the doll: the brush draws on the sheet or the body · grab to play</div>
      <a class="lab-leave" id="lab-leave" href="desktop.html" hidden>leave — back to the machine</a>
    </div>
  </div>
</div>
<script src="./poppet-lab/guide.js?v=lab52"></script>
<script type="module" src="./poppet-lab/main.js?v=lab53"></script>
<script>
  // standalone visits (not the sigil frame) get a guarded door out.
  // The sigil shell keeps its own guarded button; this covers direct carts.
  (function () {
    if (window.top !== window) return;
    var leave = document.getElementById('lab-leave');
    if (!leave) return;
    leave.hidden = false;
    leave.addEventListener('click', function (e) {
      if (window.__labDirty && !window.confirm('the doll is half-made; leave anyway?')) e.preventDefault();
    });
  })();
</script>
</body>
</html>
